# ============================================================
# 架空売買シミュレータの設定ファイル
# 銘柄や資金を変えるときは、このファイルだけ書き換えてください。
# ※実際の注文は一切出しません（検証専用）。
# ============================================================

# 対象銘柄。code は Yahoo!ファイナンスの銘柄コード（東証は末尾に .T）
# lot_size = 売買の最小単位（株・口）。買える株数に満たない端数は現金のまま残ります。
# 売買単位は JPX「銘柄一覧（ETF）」の Trading Unit 欄で確認できます（2026-10-30時点で両方10口）。
symbols:
  - code: "1321.T"   # NEXT FUNDS 日経225連動型上場投信
    lot_size: 10
  - code: "1306.T"   # NEXT FUNDS TOPIX連動型上場投信
    lot_size: 10

# 検証期間。end を null にすると「取得できる最新の取引日まで」
period:
  start: "2018-01-01"
  end: null

# 架空の口座
account:
  initial_cash: 500000     # 初期資金（円）
  monthly_deposit: 10000   # 毎月の積立額（円）。0 なら積立なし

# 売買コスト・税金（0.001 = 0.1%）
costs:
  fee_rate: 0.0            # 手数料率。比較用に 0.001 でも試せます（run.py --fee-rate 0.001）
  slippage_rate: 0.001     # 値差: 想定より不利な価格で約定する分
  tax_rate: 0.0            # 税率。NISA=0、一般口座=0.20315。利益が出た売却のときだけ引く

# 使う戦略の名前とパラメータ
strategy:
  name: sma_cross          # 終値が移動平均を上回ったら買い、下回ったら売り
  params:
    window: 25             # 移動平均の日数

# 保存先フォルダ
paths:
  data_dir: data           # 取得した株価データのキャッシュ
  output_dir: output       # 結果のグラフ・表

# 戦略の比べ方（python compare.py で使う。run.py は使わない）
# 選ぶ期間の成績で一番良い戦略を決め、確かめる期間でも「最初に買って放置」と比べる。
# 確かめる期間の end を null にすると「取得できる最新の取引日まで」
comparison:
  select_period:
    start: "2018-01-01"
    end: "2022-12-31"
  check_period:
    start: "2023-01-01"
    end: null
  candidates:
    # 1. 移動平均の日数違い
    - {name: sma_cross, params: {window: 25}}
    - {name: sma_cross, params: {window: 75}}
    - {name: sma_cross, params: {window: 200}}
    # 2. ダマシ対策: 平均より band 上で買い、band 下で売り（0.02 = 2%）
    - {name: sma_band, params: {window: 25, band: 0.02}}
    - {name: sma_band, params: {window: 75, band: 0.02}}
    - {name: sma_band, params: {window: 200, band: 0.02}}
    # 3. 買い⇄売りを切り替えたら、最低 cooldown 営業日は次の切り替えをしない
    - {name: sma_cooldown, params: {window: 25, cooldown: 20}}
    - {name: sma_cooldown, params: {window: 75, cooldown: 20}}
    - {name: sma_cooldown, params: {window: 200, cooldown: 20}}

# 機械学習の戦略の比べ方（python compare_ml.py で使う）
# 期間は上の comparison と同じ。候補の中から選ぶ期間で一番良いものを選び、確かめる期間で試す。
# ml_logistic のパラメータ:
#   threshold      予想の確率がこれ以上のときだけ持つ（0.55 = 55%）
#   horizon        何営業日後に上がったかを答えにするか（既定 5）
#   retrain_months 何か月ごとに学び直すか（既定 3。その時点までのデータだけで学ぶ）
#   min_train      学ぶのに最低限必要な日数（既定 500。足りないあいだは様子見）
ml_comparison:
  candidates:
    - {name: ml_logistic, params: {threshold: 0.50}}
    - {name: ml_logistic, params: {threshold: 0.55}}
    - {name: ml_logistic, params: {threshold: 0.60}}
  # 比べるための対照: 答えをランダムに入れ替えて学ばせた版を何通り作るか
  # 本物がこの全部より良くなければ「パターンは見つからなかった」と判定する
  shuffle_runs: 20

# フォワードテスト（python forward.py で使う。毎日1回、平日の夕方に実行する）
# 銘柄・資金・積立・コストは上の設定をそのまま使う。始めたあとに上の設定を変えると、
# 保存した口座と合わなくなるため forward.py はエラーで止まる（混ぜないため）。
forward:
  start: "2026-11-08"      # 開始日。この日以降の取引日から架空売買する
  dir: forward             # 状態と記録の保存先
  benchmark: hold          # 比べる相手（「放置」）の id
  strategies:
    # id は保存ファイルの名前（半角の小文字・数字・_・-）。一度決めたら変えない
    # 後から戦略を足すときは start に足した日を書く（書かないと上の開始日からさかのぼって動かす）
    - {id: sma25, name: sma_cross, params: {window: 25}}
    - {id: hold, name: buy_and_hold}
