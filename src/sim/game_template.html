<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>戦略くん VS 放置くん</title>
<!-- アプリのアイコンとホーム画面に追加したときの名前（アイコンは scripts/make_icons.py で作る） -->
<link rel="manifest" href="__MANIFEST_HREF__">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="戦略VS放置">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ============================================================
   Apple の Human Interface Guidelines に合わせた見た目
   - 文字は端末の字体（iPhone はヒラギノと SF）。本文 17pt、利用者の文字サイズ設定に追従（rem）
   - 色は iOS のシステムカラーの「コントラストを上げる」版（白地・黒地で 4.5:1 以上）
   - 背景は設定アプリと同じ「グループのまとまり」。操作は青、買いは緑、売りは赤
   - 再生の操作は画面の下のツールバーに固定（グラフを見ながら操作できる）
   ============================================================ */
:root {
  --tint: #0058b8;
  --bg: #f2f2f7; --cell: #ffffff; --cell2: #f2f2f7;
  --label: #000000; --label2: #636366; --label3: #8e8e93;
  --sep: rgba(60, 60, 67, .29); --fill: rgba(118, 118, 128, .12); --press: rgba(60, 60, 67, .12);
  --material: rgba(249, 249, 249, .8); --thumb: #ffffff;
  --scrim: rgba(0, 0, 0, .4);
  /* 選手の色（iOS のシステムカラー・コントラストを上げる版） */
  --strat: #3634a3; --bench: #c93400; --ai: #8944ab; --rnd: #636366; --alt: #7f6545;
  --buy: #248a3d; --sell: #d70015;
  --deposit: #8e8e93;
  --curve: cubic-bezier(.32, .72, 0, 1);      /* iOS のシートの動き */
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Segoe UI", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --tint: #409cff;
    --bg: #000000; --cell: #1c1c1e; --cell2: #2c2c2e;
    --label: #ffffff; --label2: #aeaeb2; --label3: #8e8e93;
    --sep: rgba(84, 84, 88, .65); --fill: rgba(118, 118, 128, .24); --press: rgba(235, 235, 245, .12);
    --material: rgba(29, 29, 31, .8); --thumb: #636366;
    --scrim: rgba(0, 0, 0, .6);
    --strat: #7d7aff; --bench: #ffb340; --ai: #da8fff; --rnd: #aeaeb2; --alt: #b59469;
    --buy: #30db5b; --sell: #ff6961;
    --deposit: #8e8e93;
  }
}
:root {
  /* 選手の色の薄い背景（まとまりの色に 14% 混ぜる） */
  --strat-c: color-mix(in srgb, var(--strat) 14%, var(--cell));
  --bench-c: color-mix(in srgb, var(--bench) 14%, var(--cell));
  --ai-c: color-mix(in srgb, var(--ai) 14%, var(--cell));
  --rnd-c: color-mix(in srgb, var(--rnd) 14%, var(--cell));
  --alt-c: color-mix(in srgb, var(--alt) 14%, var(--cell));
  --on-strat-c: var(--label); --on-bench-c: var(--label); --on-ai-c: var(--label);
  --on-rnd-c: var(--label); --on-alt-c: var(--label);
  /* 画面の左（A）と右（B）の選手の色。選んだキャラに合わせて JS が差し替える */
  --A: var(--strat); --A-c: var(--strat-c); --on-A-c: var(--on-strat-c);
  --B: var(--bench); --B-c: var(--bench-c); --on-B-c: var(--on-bench-c);
}

/* 文字の型（iOS の text styles。17px = 1rem。大きい文字は上限を付けて、文字を大きくしても崩さない） */
html { font-size: 17px; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
.t-large { font-size: min(2rem, 40px); line-height: 1.2; font-weight: 700; letter-spacing: .01em; }
.t-title1 { font-size: min(1.647rem, 34px); line-height: 1.25; font-weight: 700; }
.t-title2 { font-size: min(1.294rem, 28px); line-height: 1.3; font-weight: 700; }
.t-title3 { font-size: min(1.176rem, 24px); line-height: 1.3; font-weight: 600; }
.t-headline { font-size: 1rem; line-height: 1.35; font-weight: 600; }
.t-body { font-size: 1rem; line-height: 1.35; }
.t-sub { font-size: .882rem; line-height: 1.35; }
.t-sub-em { font-size: .882rem; line-height: 1.35; font-weight: 600; }
.t-foot { font-size: .765rem; line-height: 1.38; }
.t-cap { font-size: .706rem; line-height: 1.33; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; overflow-x: clip; }
body {
  background: var(--bg); color: var(--label);
  font-family: var(--font); font-size: 1rem; line-height: 1.35;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
svg.ic { width: 24px; height: 24px; fill: currentColor; flex: none; }
svg.ic-s { width: 18px; height: 18px; fill: currentColor; flex: none; }

/* 押したときの見た目（薄い灰色を重ねる）。キーボードで選んだときは青い輪 */
.st { position: relative; isolation: isolate; }
.st::before {
  content: ""; position: absolute; inset: 0; background: var(--press); opacity: 0;
  transition: opacity 200ms ease; pointer-events: none; z-index: -1; border-radius: inherit;
}
.st:active::before { opacity: 1; transition: none; }
.st:focus-visible, .row:focus-within { outline: 2px solid var(--tint); outline-offset: 2px; }

/* 上のナビゲーションバー（半透明。スクロールすると下に細い線） */
.topbar {
  position: sticky; top: 0; z-index: 10;
  padding: env(safe-area-inset-top) 16px 8px;
  background: var(--bg);
  border-bottom: .5px solid transparent;
  transition: background-color 200ms ease, border-color 200ms ease;
}
.topbar.scrolled {
  background: var(--material); border-bottom-color: var(--sep);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.topbar .bar { max-width: 560px; margin: 0 auto; }
.topbar h1 {
  margin: 0; height: 44px; display: flex; align-items: center; justify-content: center;
  white-space: nowrap; overflow: hidden; font-size: min(1rem, 20px);
}
.topbar .s { color: var(--A); } .topbar .b { color: var(--B); }
.topbar .x { color: var(--label2); margin: 0 6px; font-weight: 400; }

.app {
  max-width: 560px; margin: 0 auto;
  padding: 8px 16px calc(var(--tb-h, 150px) + 24px);
  display: flex; flex-direction: column; gap: 20px;
}
#main { display: flex; flex-direction: column; gap: 20px; }

/* セグメントで切り替え（灰色の溝に白いつまみ。つまみは選んだ所へすべる） */
.seg {
  position: relative; display: flex; padding: 2px; border-radius: 10px; background: var(--fill);
  --n: 2;
}
.seg::before {
  content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px;
  width: calc((100% - 4px) / var(--n)); border-radius: 8px; background: var(--thumb);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04);
  transition: transform 300ms var(--curve);
}
.seg:has(button:nth-child(2)[aria-pressed="true"])::before { transform: translateX(100%); }
.seg:has(button:nth-child(3)[aria-pressed="true"])::before { transform: translateX(200%); }
.seg:not(:has(button[aria-pressed="true"]))::before { opacity: 0; }
.seg button {
  position: relative; z-index: 1; flex: 1; min-width: 0; min-height: 40px; padding: 0 8px;
  border: 0; background: transparent; color: var(--label); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: min(.882rem, 18px); font-weight: 500;
}
.seg button[aria-pressed="true"] { font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--tint); outline-offset: -2px; }
.seg .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { color: var(--label2); flex: none; font-weight: 400; }
.badge:empty { display: none; }
#modes { max-width: 560px; margin: 0 auto; }
#speeds { --n: 3; flex: 1; }

/* グループのまとまり（設定アプリの角丸の表） */
.group { background: var(--cell); border-radius: 12px; overflow: hidden; }
.sec-h { color: var(--label2); padding: 0 16px 6px; text-transform: none; }
.sec-f { color: var(--label2); padding: 6px 16px 0; }
.row {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 16px;
  width: 100%; border: 0; background: transparent; color: var(--label); text-align: left;
}
.row + .row::after, .row + .row-wrap::after {
  content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: .5px solid var(--sep);
}
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .sub2 { color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .val { color: var(--label2); flex: none; }
.chev { width: 13px; height: 22px; fill: none; stroke: var(--label3); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 選手を選ぶ行（行全体が選択の欄。押すと iPhone の選択のホイールが出る） */
.pick .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.pick .side { color: var(--label2); flex: none; width: 2.2em; }
.pick .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick select {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
  font-size: 16px; -webkit-appearance: none; appearance: none;
}
.pick .updown { width: 14px; height: 20px; fill: none; stroke: var(--label3); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#pickA:active ~ *, #pickB:active ~ * { opacity: .6; }

/* 日付 */
.datebox { text-align: center; }
.datebox .sub { color: var(--label2); margin-top: 2px; }

/* カード（まとまりと同じ白い角丸） */
.card { background: var(--cell); border-radius: 12px; padding: 16px; min-width: 0; }

/* 2人の資産 */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.player { padding: 14px; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow 250ms ease; }
.player .who { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 24px; }
.player .who > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player.s .who { color: var(--A); } .player.b .who { color: var(--B); }
.player .chip-lead {
  display: none; align-items: center; gap: 2px; height: 22px; padding: 0 8px; border-radius: 11px; flex: none;
  font-weight: 600; color: #fff;
}
.player .chip-lead svg { width: 12px; height: 12px; }
.player.s .chip-lead { background: var(--A); }
.player.b .chip-lead { background: var(--B); }
@media (prefers-color-scheme: dark) { .player .chip-lead { color: #000; } }
.player.lead .chip-lead { display: inline-flex; }
.player.s.lead { box-shadow: inset 0 0 0 2px var(--A); } .player.b.lead { box-shadow: inset 0 0 0 2px var(--B); }
.player .label { color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.money { margin-top: 10px; white-space: nowrap; transition: color 200ms ease; }
.money .yen { font-size: .765rem; color: var(--label2); margin-left: 2px; font-weight: 400; }
.money.up { color: var(--buy); } .money.down { color: var(--sell); }
.pct { margin-top: 4px; white-space: nowrap; }
.pct .pp { display: block; color: var(--label2); }
.pos { color: var(--buy); } .neg { color: var(--sell); } .zero { color: var(--label2); }

/* リード（綱引きの棒） */
.lead-text { display: flex; justify-content: center; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lead-text.s { color: var(--A); } .lead-text.b { color: var(--B); } .lead-text.e { color: var(--label2); }
.tug { position: relative; height: 6px; background: var(--fill); border-radius: 3px; margin-top: 12px; }
.tug .mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--label3); border-radius: 1px; }
.tug .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; transition: left 150ms ease, width 150ms ease; }
.tug-cap { display: flex; justify-content: space-between; color: var(--label2); margin-top: 8px; }

/* AIくんの予想メーター（基準の線つき） */
.ai-head { display: flex; flex-direction: column; gap: 2px; }
.ai-head .t { color: var(--ai); }
.ai-head .sub { color: var(--label2); }
.meter-row { display: grid; grid-template-columns: 4.6em 1fr 2.8em 3.6em; align-items: center; gap: 8px; margin-top: 12px; }
.meter-row .sym { color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--fill); margin: 10px 0 16px; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--label3); transition: width 250ms var(--curve); }
.meter.on .fill { background: var(--ai); }
.meter .th { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--label); border-radius: 1px; }
.meter .th-l { position: absolute; top: 13px; transform: translateX(-50%); color: var(--label2); white-space: nowrap; }
.meter-row .val { text-align: right; }
.meter-row .act { text-align: center; border-radius: 6px; padding: 2px; color: var(--label2); background: var(--fill); white-space: nowrap; }
.meter-row .act.on { background: var(--ai); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { .meter-row .act.on { color: #000; } }
.ai-top { margin: 8px -16px -16px; padding: 12px 16px 16px; border-top: .5px solid var(--sep); color: var(--label2); transition: background-color 600ms ease; }
.ai-top.flash { background: var(--ai-c); transition: none; }
.ai-top .cap { color: var(--label); font-weight: 600; }
.ai-top .feat { margin-top: 4px; overflow-wrap: anywhere; }
.ai-top .feat b { font-weight: 600; color: var(--label); }
.ai-top .feat .f { white-space: nowrap; }
.ai-top .hint { margin-top: 6px; }

/* グラフ */
.chart { padding: 12px 8px 12px; }
.chart.shake { animation: shake 300ms ease; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-3px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-2px); } }
canvas { display: block; width: 100%; height: 240px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--label2); padding: 8px 8px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; }
.legend .dash { background: repeating-linear-gradient(90deg, var(--deposit) 0 4px, transparent 4px 7px); }
.legend .m-b { color: var(--buy); } .legend .m-s { color: var(--sell); }

/* 最近の売買（まとまりの行） */
.row-item { position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 16px; }
.row-item + .row-item::after { content: ""; position: absolute; top: 0; right: 0; left: 34px; border-top: .5px solid var(--sep); }
.row-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.row-item .dot.buy { background: var(--buy); } .row-item .dot.sell { background: var(--sell); } .row-item .dot.topup { background: var(--label3); }
.row-item .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row-item .when { color: var(--label2); flex: none; }
.empty-row { color: var(--label2); padding: 12px 16px; }

/* 名場面（まとまりの行。右に ›） */
.scene { gap: 12px; }
.scene > svg.ic { color: var(--tint); width: 22px; height: 22px; }
.scene .tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.scene .sb { color: var(--label2); }

.note { color: var(--label2); text-align: center; margin: 0; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }

/* 下のツールバー（半透明・固定）: 日付のスライダー、再生、速さ、結果 */
.toolbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--material); border-top: .5px solid var(--sep);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  padding: 4px 16px calc(8px + env(safe-area-inset-bottom));
}
.toolbar .in { max-width: 560px; margin: 0 auto; }
.range-cap { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; color: var(--label2); margin-top: -6px; }
.range-cap #last { text-align: right; }
.range-cap #tbDate { color: var(--label); font-weight: 600; }
.playrow { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 22px; flex: none;
  background: transparent; color: var(--tint); display: grid; place-items: center;
}
.icon-btn svg { width: 30px; height: 30px; }
.text-btn {
  border: 0; background: transparent; color: var(--tint); min-height: 44px; padding: 0 6px; border-radius: 8px;
  font-size: min(1rem, 20px); flex: none; white-space: nowrap;
}

/* スライダー（iOS: 細い溝・白い丸いつまみ。左側は青） */
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 40px; margin: 0; background: transparent;
  --p: 0%;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(to right, var(--tint) var(--p), var(--fill) var(--p));
}
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--fill); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--tint); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; margin-top: -11px;
  background: #fff; border: 0; box-shadow: 0 .5px 4px rgba(0, 0, 0, .12), 0 6px 13px rgba(0, 0, 0, .12);
}
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 .5px 4px rgba(0, 0, 0, .12), 0 6px 13px rgba(0, 0, 0, .12); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--tint); }

/* 実況（上から出る丸い知らせ。半透明） */
.call {
  position: fixed; left: 50%; top: calc(var(--nav-h, 100px) + 8px); z-index: 20;
  transform: translate(-50%, -12px) scale(.94); opacity: 0; pointer-events: none;
  width: max-content; max-width: min(528px, calc(100vw - 32px)); min-height: 44px;
  display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 14px;
  background: var(--material); color: var(--label); border-radius: 22px;
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .16), 0 0 0 .5px var(--sep);
  font-weight: 600;
  transition: transform 450ms var(--curve), opacity 200ms ease;
}
.call.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
.call .bar { width: 10px; height: 10px; border-radius: 50%; background: var(--tint); flex: none; }
.call.s .bar { background: var(--A); } .call.b .bar { background: var(--B); } .call.d .bar { background: var(--sell); }
.call.ai .bar { background: var(--ai); }

/* 結果のシート（下から出る。左上に「閉じる」、中央に題名） */
.over {
  position: fixed; inset: 0; z-index: 30; background: var(--scrim);
  display: flex; align-items: flex-end; justify-content: center;
  padding-top: calc(16px + env(safe-area-inset-top));
  opacity: 0; visibility: hidden; transition: opacity 300ms ease, visibility 0s linear 400ms;
}
.over.show { opacity: 1; visibility: visible; transition: opacity 300ms ease; }
.sheet {
  width: 100%; max-width: 560px; max-height: 100%; display: flex; flex-direction: column;
  background: var(--bg); border-radius: 14px 14px 0 0;
  transform: translateY(100%); transition: transform 450ms var(--curve);
}
.over.show .sheet { transform: none; }
.sheet-head {
  position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  min-height: 56px; padding: 6px 8px 0; flex: none;
}
.sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--label3); opacity: .5; }
.sheet-head .text-btn { justify-self: start; }
.sheet-head h2 { margin: 0; }
.sheet-body { overflow: auto; padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 20px; -webkit-overflow-scrolling: touch; }
.sheet-body > * { flex: none; }      /* 中身が多いときは縮めずにスクロール */
.winner { text-align: center; padding: 8px 0 0; }
.winner .k { color: var(--label2); }
.winner .n { margin-top: 4px; }
.winner .d { color: var(--label2); margin-top: 4px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 11px 16px 11px 4px; text-align: right; white-space: nowrap; position: relative; }
th:first-child, td:first-child { text-align: left; color: var(--label2); white-space: normal; padding-left: 16px; }
th:last-child, td:last-child { padding-right: 16px; }
tbody tr td { border-top: .5px solid var(--sep); }
tbody tr td:first-child { border-top: 0; }
tbody tr td:first-child::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
thead th { padding-top: 12px; padding-bottom: 8px; }
thead th.s { color: var(--A); } thead th.b { color: var(--B); }
td small { font-size: .706rem; }
td.win { font-weight: 700; }
td.win::after { content: " ★"; color: var(--tint); font-size: .706rem; }
.sheet-actions { display: flex; flex-direction: column; gap: 4px; }
.big-btn {
  min-height: 50px; border: 0; border-radius: 12px; background: var(--tint); color: #fff;
  font-size: 1rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
}
@media (prefers-color-scheme: dark) { .big-btn { color: #000; } }
.sheet-actions .text-btn { align-self: center; }

/* AIくん と ランダムくん（結果のシートの中） */
.ml-res .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 16px 4px; }
.ml-res .vs .a { color: var(--ai); } .ml-res .vs .r { color: var(--rnd); }
.ml-res .chip-v { min-height: 28px; display: inline-flex; align-items: center; padding: 2px 12px; border-radius: 14px; font-weight: 600; }
.ml-res .chip-v.learned { background: var(--ai-c); color: var(--ai); }
.ml-res .chip-v.not_learned { background: color-mix(in srgb, var(--sell) 14%, var(--cell)); color: var(--sell); }
.ml-res .chip-v.pending { background: var(--fill); color: var(--label2); }
.ml-res .dt { padding: 4px 16px 16px; color: var(--label2); }
.ml-res td.ph { padding: 14px 16px 0; color: var(--label2); text-align: left; font-weight: 600; }
.ml-res td.ph::before { display: none; }
.ml-res tr:has(td.ph) td { border-top: 0; }
.ml-res thead th.a { color: var(--ai); } .ml-res thead th.r { color: var(--rnd); }

/* フォワードテスト: 今日の対戦結果 */
.today { padding: 16px; }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.today-head .d { color: var(--label2); white-space: nowrap; }
.today-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.tcol { border-radius: 10px; padding: 12px; min-width: 0; }
.tcol.s { background: var(--A-c); color: var(--on-A-c); }
.tcol.b { background: var(--B-c); color: var(--on-B-c); }
.tcol.s > :first-child { color: var(--A); } .tcol.b > :first-child { color: var(--B); }
.tcol .big { margin-top: 4px; white-space: nowrap; }
.tcol .big .yen { font-size: .765rem; margin-left: 2px; font-weight: 400; color: var(--label2); }
.tcol .chg { margin-top: 4px; white-space: nowrap; }
.tcol .chg small { color: var(--label2); margin-right: 4px; font-size: .706rem; font-weight: 400; }
.tcol .chg-pos { color: var(--buy); } .tcol .chg-neg { color: var(--sell); }
.tcol .chg-pos::before { content: "▲ "; font-size: .6rem; } .tcol .chg-neg::before { content: "▼ "; font-size: .6rem; }
.tcol .tr { margin-top: 8px; overflow-wrap: anywhere; color: var(--label2); }
.today-lead { text-align: center; margin-top: 16px; }
.today-lead .w { margin-right: 8px; }
.today-lead.s { color: var(--A); } .today-lead.b { color: var(--B); } .today-lead.e { color: var(--label2); }
.today-lead .y { display: block; color: var(--label2); margin-top: 2px; }
.totals { margin: 16px -16px 0; border-top: .5px solid var(--sep); padding: 14px 16px 0; }
.totals .cap { color: var(--label2); }
.tbar { display: flex; gap: 2px; height: 8px; margin-top: 8px; border-radius: 4px; overflow: hidden; }
.tbar span { display: block; height: 100%; min-width: 0; }
.tnums { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; color: var(--label2); }
.tnums span { display: inline-flex; align-items: center; gap: 6px; }
.tnums i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.updated { color: var(--label2); text-align: right; margin-top: 12px; }

/* 記録がまだないとき */
.empty-card { margin-top: 24px; text-align: center; padding: 32px 24px; }
.empty-card .icon { width: 48px; height: 48px; color: var(--tint); margin: 0 auto 16px; display: block; }
.empty-card .big b { display: block; color: var(--tint); }
.empty-card .sub { color: var(--label2); margin-top: 16px; }
.empty { text-align: center; padding: 40px 16px; color: var(--label2); }

@media (prefers-reduced-motion: reduce) {
  .chart.shake { animation: none; }
  .call, .sheet, .seg::before { transition: opacity 150ms linear; }
  .call, .call.show { transform: translate(-50%, 0); }
  .sheet { transform: none; }
}
</style>
</head>
<body>
<div class="call t-sub" id="call" role="status" aria-live="polite"><span class="bar"></span><span id="callText"></span></div>

<header class="topbar" id="topbar">
  <div class="bar"><h1 class="t-headline" id="title"><span class="s">戦略くん</span><span class="x">VS</span><span class="b">放置くん</span></h1></div>
  <div class="seg" id="modes" role="group" aria-label="表示するもの">
    <button data-mode="replay" aria-pressed="false"><span class="lbl">過去のリプレイ</span></button>
    <button data-mode="forward" aria-pressed="false"><span class="lbl">フォワードテスト</span><span class="badge t-cap" id="fwBadge"></span></button>
  </div>
</header>

<div class="app">
  <div id="main">
    <section id="pickWrap" aria-label="対戦する選手">
      <div class="sec-h t-foot">対戦する選手</div>
      <div class="group">
        <label class="row pick">
          <span class="side t-sub">左</span><span class="dot" style="background:var(--A)"></span>
          <span class="grow"><span class="nm t-body" id="pickAName"></span><span class="sub2 t-foot" id="pickALabel"></span></span>
          <svg class="updown" viewBox="0 0 14 20"><path d="M3 7.5 7 3.5l4 4M3 12.5l4 4 4-4"/></svg>
          <select id="pickA" aria-label="左の選手"></select>
        </label>
        <label class="row pick">
          <span class="side t-sub">右</span><span class="dot" style="background:var(--B)"></span>
          <span class="grow"><span class="nm t-body" id="pickBName"></span><span class="sub2 t-foot" id="pickBLabel"></span></span>
          <svg class="updown" viewBox="0 0 14 20"><path d="M3 7.5 7 3.5l4 4M3 12.5l4 4 4-4"/></svg>
          <select id="pickB" aria-label="右の選手"></select>
        </label>
      </div>
    </section>

    <div class="datebox"><div class="t-large num" id="date">----</div><div class="sub t-foot num" id="dateSub"></div></div>

    <section class="today card" id="today" hidden aria-label="今日の対戦結果"></section>

    <div class="board">
      <div class="card player s" id="cardS">
        <div class="who t-sub-em"><span id="nameS">戦略くん</span><span class="chip-lead t-cap"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>リード</span></div>
        <div class="label t-foot" id="labelS"></div>
        <div class="money t-title2 num" id="moneyS">0<span class="yen">円</span></div>
        <div class="pct t-foot num" id="pctS"></div>
      </div>
      <div class="card player b" id="cardB">
        <div class="who t-sub-em"><span id="nameB">放置くん</span><span class="chip-lead t-cap"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>リード</span></div>
        <div class="label t-foot" id="labelB"></div>
        <div class="money t-title2 num" id="moneyB">0<span class="yen">円</span></div>
        <div class="pct t-foot num" id="pctB"></div>
      </div>
    </div>

    <div class="card">
      <div class="lead-text e" id="leadText"><span class="t-headline">互角</span><span class="t-title2 num">0円</span></div>
      <div class="tug"><div class="mid"></div><div class="fill" id="tug"></div></div>
      <div class="tug-cap t-foot"><span id="capS">← 戦略くん</span><span id="capB">放置くん →</span></div>
    </div>

    <section aria-label="資産の推移">
      <div class="sec-h t-foot">資産の推移</div>
      <div class="card chart" id="chartWrap">
        <canvas id="chart" aria-label="資産の推移グラフ"></canvas>
        <div class="legend t-foot">
          <span><i style="background:var(--A)"></i><span id="legS">戦略くん</span></span>
          <span><i style="background:var(--B)"></i><span id="legB">放置くん</span></span>
          <span><i class="dash"></i>投入総額</span>
          <span><b class="m-b">▲</b>買い <b class="m-s">▼</b>売り</span>
        </div>
      </div>
    </section>

    <section id="aiCard" hidden aria-label="AIくんの予想">
      <div class="sec-h t-foot">AIくんの予想</div>
      <div class="card">
        <div class="ai-head"><span class="t t-headline">5営業日後に上がる確率</span><span class="sub t-foot">この日の終値で予想。基準の線を超えたら持つ</span></div>
        <div id="meters"></div>
        <div class="ai-top t-foot" id="aiTop"></div>
      </div>
    </section>

    <section aria-label="最近の売買">
      <div class="sec-h t-foot">最近の売買</div>
      <div class="group" id="log"></div>
    </section>

    <section aria-label="名場面ジャンプ">
      <div class="sec-h t-foot">名場面ジャンプ</div>
      <div class="group" id="scenes"></div>
      <div class="sec-f t-foot">押すと、その少し前の日から再生します。</div>
    </section>

    <p class="note t-foot">架空売買のシミュレーションです。実際の注文は出していません。<br>
      資産は積立の入金を含む額。最大の落ち込みは入金の影響を除いて計算しています。</p>
  </div>
  <div id="emptyMode" hidden></div>
</div>

<nav class="toolbar" id="toolbar" aria-label="再生の操作">
  <div class="in">
    <input type="range" id="seek" min="0" max="0" value="0" aria-label="日付を選ぶ">
    <div class="range-cap t-cap num"><span id="first"></span><span id="tbDate"></span><span id="last"></span></div>
    <div class="playrow">
      <button class="icon-btn st" id="play" aria-label="再生">
        <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="seg" id="speeds" role="group" aria-label="再生の速さ">
        <button data-speed="1" aria-pressed="false"><span class="lbl">1倍</span></button>
        <button data-speed="5" aria-pressed="false"><span class="lbl">5倍</span></button>
        <button data-speed="20" aria-pressed="false"><span class="lbl">20倍</span></button>
      </div>
      <button class="text-btn st" id="showResult">結果</button>
    </div>
  </div>
</nav>

<div class="over" id="over">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button class="text-btn st" id="closeRes">閉じる</button>
      <h2 class="t-headline" id="sheetTitle">結果</h2>
      <span></span>
    </div>
    <div class="sheet-body">
      <div class="winner">
        <div class="k t-sub" id="winKind">勝者</div>
        <div class="n t-title1" id="winName">-</div>
        <div class="d t-sub num" id="winDiff"></div>
      </div>
      <div class="group tbl-wrap">
        <table class="t-sub">
          <thead><tr><th></th><th class="s t-sub-em" id="thS">戦略くん</th><th class="b t-sub-em" id="thB">放置くん</th></tr></thead>
          <tbody id="resBody"></tbody>
        </table>
      </div>
      <div class="group ml-res" id="mlRes" hidden></div>
      <div class="sheet-actions">
        <button class="big-btn st" id="again">最初から見る</button>
        <button class="text-btn st" id="change">選手を変える</button>
      </div>
    </div>
  </div>
</div>

<script>
const GAME = /*__GAME_DATA__*/null;

(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const yen = (v) => Math.round(v).toLocaleString("ja-JP");
  const signedYen = (v) => (v >= 0 ? "+" : "−") + yen(Math.abs(v)) + "円";
  const pctText = (v, d = 1) => {
    const t = Math.abs(v * 100).toFixed(d);
    return (+t === 0 ? "" : v > 0 ? "+" : "−") + t + "%";
  };
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // 1倍 = 1秒に10営業日。フォワードテストで日数が少ないうち（60日以下）は1秒に1日
  const daysPerSec = () => (ds && ds.kind === "forward" && ds.dates.length <= 60 ? 1 : 10);
  const ICON = { play: '<path d="M8 5v14l11-7z"/>', pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' };

  // 色は CSS の役割（トークン）から読む。明るい表示・暗い表示が切り替わったら読み直す
  const C = {};
  function readColors() {
    const css = getComputedStyle(document.documentElement);
    const get = (k) => css.getPropertyValue(k).trim();
    Object.assign(C, {
      strat: get("--A"), bench: get("--B"), ai: get("--ai"), buy: get("--buy"), sell: get("--sell"),
      deposit: get("--deposit"), muted: get("--label2"), line: get("--sep"),
      surface: get("--cell"), primary: get("--tint"),
    });
  }
  readColors();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); yRange = null; });

  // ---------------- 状態 ----------------
  // P = 左の選手（A）、B = 右の選手（B）。roster = 選べる全員（放置くん＋ほかの選手）
  let mode = "replay", ds = null, P = null, B = null, roster = [];
  let pos = 0, day = 0, playing = false, speed = 1, lastT = 0;
  let disp = { s: 0, b: 0 }, flashUntil = { s: 0, b: 0 };
  let yRange = null, effects = [], lastShake = 0;
  let callQueue = [], callBusyUntil = 0, callTimer = null;
  let ev = null;      // 実況のための記憶（リーダー・リードの節目など）
  let finished = false;

  // 上のアプリバー: スクロールしたら色を変えて影をつける
  const topbar = $("topbar");
  new ResizeObserver(() => {
    const st = document.documentElement.style;
    st.setProperty("--nav-h", topbar.offsetHeight + "px");
    st.setProperty("--tb-h", $("toolbar").offsetHeight + "px");
  }).observe(document.body);
  window.addEventListener("scroll", () => topbar.classList.toggle("scrolled", window.scrollY > 0), { passive: true });

  // ---------------- モード ----------------
  function setMode(m) {
    const data = GAME && GAME.modes && GAME.modes[m];
    const fw = GAME && GAME.modes && GAME.modes.forward;
    $("fwBadge").textContent = !fw ? "準備中" : fw.empty ? "開始前" : "";
    if (data && data.empty) {     // フォワードテストの記録がまだ0日分
      pause(); mode = m; markMode(m);
      const [head, rest] = String(data.message).split("：");
      $("main").hidden = true; $("toolbar").hidden = true; $("emptyMode").hidden = false;
      $("emptyMode").innerHTML = `<div class="card empty-card">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        <div class="big t-title2">${escapeHtml(head)}${rest ? `<b>${escapeHtml(rest)}</b>` : ""}</div>
        <div class="sub t-sub">開始日 ${escapeHtml(data.start)}。架空の資金で、選手たちが毎日対戦します。<br>
        平日の夕方に自動で更新されます。</div></div>`;
      return;
    }
    if (!data) {
      if (m !== "replay" && ds) { say(m === "forward" ? "フォワードテストのデータはまだありません" : "データがありません", ""); return; }
      markMode(m);
      $("main").hidden = true; $("toolbar").hidden = true; $("emptyMode").hidden = false;
      $("emptyMode").innerHTML = '<div class="empty t-sub">表示できるデータがありません。run.py を実行すると、ここに結果が入ります。</div>';
      return;
    }
    mode = m; ds = data; markMode(m);
    // char・name が無い古いデータは、最初（benchmark）を放置くん、ほかを戦略くんとして扱う
    roster = [ds.benchmark, ...ds.players].map((p, k) =>
      ({ ...(k === 0 ? { char: "hold", name: "放置くん" } : { char: "strategy", name: "戦略くん" }), ...p }));
    $("main").hidden = false; $("toolbar").hidden = false; $("emptyMode").hidden = true;
    const opts = roster.map((p, k) => `<option value="${k}">${escapeHtml(p.name)}｜${escapeHtml(p.label)}</option>`).join("");
    $("pickA").innerHTML = opts; $("pickB").innerHTML = opts;
    $("seek").max = ds.dates.length - 1;
    $("first").textContent = ds.dates[0];
    $("last").textContent = ds.dates[ds.dates.length - 1];
    $("today").hidden = ds.kind !== "forward";
    // はじめは「戦略くん VS 放置くん」。戦略くんがいなければ最初の選手
    let a = roster.findIndex((p) => p.char === "strategy");
    if (a < 0) a = 1;
    setPair(a, 0);
  }
  function markMode(m) {
    document.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  }

  // 左右の選手を決める。キャラの色を左右に当て、同じキャラ同士なら右は別の色にする
  const COLOR_OF = { hold: "bench", strategy: "strat", ai: "ai", random: "rnd" };
  let pickIdx = [1, 0];
  function setPair(a, b) {
    pickIdx = [a, b];
    P = roster[a]; B = roster[b];
    $("pickA").value = String(a); $("pickB").value = String(b);
    const ca = COLOR_OF[P.char] || "strat";
    let cb = COLOR_OF[B.char] || "bench";
    if (cb === ca) cb = "alt";
    const st = document.documentElement.style;
    for (const [side, c] of [["A", ca], ["B", cb]]) {
      st.setProperty(`--${side}`, `var(--${c})`);
      st.setProperty(`--${side}-c`, `var(--${c}-c)`);
      st.setProperty(`--on-${side}-c`, `var(--on-${c}-c)`);
    }
    readColors();
    $("title").innerHTML = `<span class="s">${escapeHtml(P.name)}</span><span class="x">VS</span><span class="b">${escapeHtml(B.name)}</span>`;
    document.title = `${P.name} VS ${B.name}`;
    $("nameS").textContent = P.name; $("nameB").textContent = B.name;
    $("labelS").textContent = P.label; $("labelB").textContent = B.label;
    $("pickAName").textContent = P.name; $("pickALabel").textContent = P.label;
    $("pickBName").textContent = B.name; $("pickBLabel").textContent = B.label;
    $("pickAName").style.color = "var(--A)"; $("pickBName").style.color = "var(--B)";
    $("capS").textContent = `← ${P.name}`; $("capB").textContent = `${B.name} →`;
    $("legS").textContent = P.name; $("legB").textContent = B.name;
    AI = [P, B].find((p) => p.char === "ai" && p.ml) || null;
    $("aiCard").hidden = !AI;
    aiShownDay = -1;
    buildScenes();
    // フォワードテストは「今日」の画面から始める（再生すると開始日から）
    seek(ds.kind === "forward" ? ds.dates.length - 1 : 0);
    pause();
    if (ds.kind === "forward") renderToday();
  }

  // ---------------- フォワードテスト: 今日の対戦結果と通算成績 ----------------
  const md = (d) => { const t = new Date(d + "T00:00:00"); return `${t.getMonth() + 1}/${t.getDate()}(${"日月火水木金土"[t.getDay()]})`; };
  function renderToday() {
    const L = ds.dates.length - 1;
    const dep = ds.deposited;
    const change = (pl) => (L > 0 ? pl.equity[L] - pl.equity[L - 1] - (dep[L] - dep[L - 1]) : pl.equity[0] - dep[0]);
    const tradesOf = (pl) => {
      const ms = pl.markers.filter((m) => m.i === L);
      if (!ms.length) return "売買なし";
      return ms.map((m) => `${escapeHtml(m.symbol)} ${m.side === "buy" ? (m.kind === "topup" ? "積立で買い増し" : "買い") : "全部売り"} ${m.shares.toLocaleString("ja-JP")}口`).join("<br>");
    };
    const col = (pl, cls, name) => {
      const c = change(pl);
      return `<div class="tcol ${cls}"><div class="t-sub-em">${name}</div>
        <div class="big t-title2 num">${yen(pl.equity[L])}<span class="yen">円</span></div>
        <div class="chg t-sub-em num ${c > 0 ? "chg-pos" : c < 0 ? "chg-neg" : ""}"><small>今日</small>${signedYen(c)}</div>
        <div class="tr t-foot">${tradesOf(pl)}</div></div>`;
    };
    const lead = P.equity[L] - B.equity[L];
    const prev = L > 0 ? P.equity[L - 1] - B.equity[L - 1] : 0;
    const leadHtml = Math.abs(lead) < 1
      ? `<div class="today-lead e"><span class="w t-headline">互角</span><span class="t-title1 num">0円</span></div>`
      : `<div class="today-lead ${lead > 0 ? "s" : "b"}"><span class="w t-headline">${escapeHtml(lead > 0 ? P.name : B.name)}がリード</span><span class="t-title1 num">+${yen(Math.abs(lead))}円</span>
         <span class="y t-foot num">${L > 0 ? `前の日より${escapeHtml(P.name)}が ${signedYen(lead - prev)}` : "初日"}</span></div>`;
    let win = 0, lose = 0, tie = 0;
    for (let j = 0; j <= L; j++) { const l = P.equity[j] - B.equity[j]; if (Math.abs(l) < 1) tie++; else if (l > 0) win++; else lose++; }
    const n = L + 1, w = (x) => (x / n * 100).toFixed(1) + "%";
    const seg = (x, color) => (x ? `<span style="width:${w(x)};background:${color}"></span>` : "");
    $("today").innerHTML = `
      <div class="today-head"><span class="t t-headline">今日の対戦結果</span><span class="d t-foot num">${md(ds.dates[L])}・${n}営業日目</span></div>
      <div class="today-grid">${col(P, "s", escapeHtml(P.name))}${col(B, "b", escapeHtml(B.name))}</div>
      ${leadHtml}
      <div class="totals">
        <div class="cap t-foot">開始（${md(ds.dates[0])}）からの通算 ${n}営業日</div>
        <div class="tbar">${seg(win, "var(--A)")}${seg(tie, "var(--sep)")}${seg(lose, "var(--B)")}</div>
        <div class="tnums t-foot num"><span><i style="background:var(--A)"></i>${escapeHtml(P.name)}リード ${win}日</span><span><i style="background:var(--sep)"></i>同点 ${tie}日</span><span><i style="background:var(--B)"></i>ビハインド ${lose}日</span></div>
      </div>
      <div class="updated t-cap num">更新 ${escapeHtml(String(ds.updated_at).replace("T", " ").slice(0, 16))}</div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------------- 再生 ----------------
  function setPlayIcon(name) {
    $("playIcon").innerHTML = ICON[name];
    $("play").setAttribute("aria-label", name === "play" ? "再生" : "一時停止");
  }
  function play() {
    if (day >= ds.dates.length - 1) seek(0);
    playing = true; finished = false; setPlayIcon("pause");
    lastT = performance.now();
  }
  function pause() { playing = false; setPlayIcon("play"); }

  function seek(i) {
    i = Math.max(0, Math.min(ds.dates.length - 1, Math.round(i)));
    pos = i; day = i; effects = []; yRange = null; finished = false;
    disp.s = P.equity[i]; disp.b = B.equity[i];
    ev = initEvents(i);
    callQueue = [];
    updateView(true);
  }

  function setSpeed(v) {
    speed = v;
    document.querySelectorAll("#speeds button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.speed === v)));
  }

  function frame(t) {
    const dt = Math.min(0.1, (t - lastT) / 1000 || 0);
    lastT = t;
    if (playing && ds) {
      pos += dt * daysPerSec() * speed;
      const target = Math.min(ds.dates.length - 1, Math.floor(pos));
      while (day < target) { day++; onNewDay(day); }
      if (day >= ds.dates.length - 1) { pos = day; pause(); if (!finished) { finished = true; say("決着！", ""); setTimeout(showResult, 1300); } }
    }
    if (ds && !$("main").hidden) {
      const k = 1 - Math.exp(-dt * 12);    // 数字がなめらかに目標へ近づく
      disp.s += (P.equity[day] - disp.s) * k;
      disp.b += (B.equity[day] - disp.b) * k;
      updateView(false);
      draw(t);
    }
    requestAnimationFrame(frame);
  }

  // ---------------- 画面の更新 ----------------
  function updateView(full) {
    const i = day, now = performance.now();
    $("date").textContent = ds.dates[i];
    $("dateSub").textContent = `${i + 1} / ${ds.dates.length} 営業日`;
    $("tbDate").textContent = ds.dates[i];
    const sk = $("seek");
    if (full || +sk.value !== i) sk.value = i;
    sk.style.setProperty("--p", (ds.dates.length > 1 ? i / (ds.dates.length - 1) * 100 : 100) + "%");
    const dep = ds.deposited[i];
    setMoney("S", disp.s, P.equity[i], dep, now, "s");
    setMoney("B", disp.b, B.equity[i], dep, now, "b");

    const lead = P.equity[i] - B.equity[i];
    const lt = $("leadText");
    const tie = Math.abs(lead) < 1;
    lt.className = "lead-text " + (tie ? "e" : lead > 0 ? "s" : "b");
    lt.innerHTML = tie ? '<span class="t-headline">互角</span><span class="t-title2 num">0円</span>'
      : `<span class="t-headline">${escapeHtml(lead > 0 ? P.name : B.name)}がリード</span><span class="t-title2 num">+${yen(Math.abs(lead))}円</span>`;
    $("cardS").classList.toggle("lead", lead > 0.5);
    $("cardB").classList.toggle("lead", lead < -0.5);
    const share = Math.min(1, Math.abs(lead) / Math.max(1, B.equity[i]) / 0.3);   // 30%差で振り切れ
    const tug = $("tug");
    tug.style.background = lead > 0 ? C.strat : C.bench;
    tug.style.width = (share * 50) + "%";
    tug.style.left = lead > 0 ? (50 - share * 50) + "%" : "50%";

    if (full) renderLog();
    if (AI && aiShownDay !== i) renderAI(i);
  }

  // ---------------- AIくんの予想メーターと、重視している特徴 ----------------
  let AI = null, aiShownDay = -1;
  const SYM_NAME = { "1321.T": "日経225", "1306.T": "TOPIX" };
  const symName = (s) => SYM_NAME[s] || s;
  function renderAI(i) {
    aiShownDay = i;
    const ml = AI.ml, th = ml.threshold;
    const syms = Object.keys(ml.prob);
    $("meters").innerHTML = syms.map((s) => {
      const p = ml.prob[s][i];
      const on = p != null && p >= th;
      const w = p == null ? 0 : Math.round(p * 1000) / 10;
      return `<div class="meter-row">
        <span class="sym t-foot">${escapeHtml(symName(s))}</span>
        <div class="meter ${on ? "on" : ""}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p == null ? 0 : Math.round(p * 100)}" aria-label="${escapeHtml(symName(s))}が上がる確率">
          <div class="fill" style="width:${w}%"></div><div class="th" style="left:${th * 100}%"></div>
          <span class="th-l t-cap num" style="left:${th * 100}%">基準${Math.round(th * 100)}%</span></div>
        <span class="val t-sub-em num">${p == null ? "—" : Math.round(p * 100) + "%"}</span>
        <span class="act t-cap ${on ? "on" : ""}">${p == null ? "様子見" : on ? "持つ" : "持たない"}</span></div>`;
    }).join("");
    // その日に使っているモデル（銘柄ごとに、その日以前で一番新しい学び直し）
    const cur = {};
    let lastDate = null;
    for (const r of ml.retrains) {
      if (r.i > i) break;
      for (const [s, top] of Object.entries(r.top)) cur[s] = { top, date: r.date };
      lastDate = r.date;
    }
    const ent = Object.entries(cur);
    $("aiTop").innerHTML = !ent.length ? '<span class="cap t-foot">まだ学習していません（学ぶデータが足りないあいだは様子見）</span>'
      : `<div class="cap t-foot">重視している特徴（${escapeHtml(lastDate.slice(5).replace("-", "/"))}までのデータで学習）</div>` +
        ent.map(([s, v]) => `<div class="feat"><b>${escapeHtml(symName(s))}</b>：${v.top.map((t) => `<span class="f">${escapeHtml(t.name)}${t.sign > 0 ? "↑" : "↓"} ${Math.round(t.share * 100)}%</span>`).join("・")}</div>`).join("") +
        '<div class="hint t-cap">↑ 大きいほど上がると予想　↓ 小さいほど上がると予想　％は重視の割合</div>';
  }

  function setMoney(key, shown, actual, dep, now, k) {
    const el = $("money" + key);
    el.innerHTML = `${yen(shown)}<span class="yen">円</span>`;
    el.classList.toggle("up", now < flashUntil[k] && flashDir[k] > 0);
    el.classList.toggle("down", now < flashUntil[k] && flashDir[k] < 0);
    const p = (actual - dep) / dep;
    const pe = $("pct" + key);
    pe.className = "pct t-foot num " + (p > 0 ? "pos" : p < 0 ? "neg" : "zero");
    pe.innerHTML = `損益 ${signedYen(actual - dep)}<span class="pp">投入総額の${pctText(p)}</span>`;
  }
  const flashDir = { s: 0, b: 0 };

  function renderLog() {
    const all = [...P.markers.map((m) => [P.name, m]), ...B.markers.map((m) => [B.name, m])]
      .filter(([, m]) => m.i <= day).sort((a, b) => a[1].i - b[1].i).slice(-3).reverse();
    $("log").innerHTML = all.length ? all.map(([who, m]) => logLine(who, m)).join("")
      : '<div class="empty-row t-sub">まだ売買はありません</div>';
  }
  function logLine(who, m) {
    const word = m.side === "buy" ? (m.kind === "topup" ? "積立で買い増し" : "買い") : "全部売り";
    const dot = m.kind === "topup" ? "topup" : m.side;
    return `<div class="row-item"><span class="dot ${dot}"></span>
      <span class="txt t-sub">${escapeHtml(who)}　${escapeHtml(m.symbol)} ${word} ${m.shares.toLocaleString("ja-JP")}口</span><span class="when t-foot num">${ds.dates[m.i].slice(5).replace("-", "/")}</span></div>`;
  }

  // ---------------- 1日進んだとき（効果と実況） ----------------
  const markerIndex = (pl) => {
    const map = new Map();
    for (const m of pl.markers) { if (!map.has(m.i)) map.set(m.i, []); map.get(m.i).push(m); }
    return map;
  };
  let mapS = null, mapB = null;

  function initEvents(i) {
    mapS = markerIndex(P); mapB = markerIndex(B);
    const lead = P.equity[i] - B.equity[i];
    return { leader: leaderOf(i, 0), milestone: Math.floor(Math.abs(lead) / 100000), lastTradeCall: { s: -999, b: -999 }, lastBigMove: -999 };
  }

  function leaderOf(i, current) {
    // 小さな差で毎日入れ替わらないよう、相手の資産の0.5%を超えたときだけリーダーが替わる
    const lead = P.equity[i] - B.equity[i];
    const th = 0.005 * B.equity[i];
    if (lead > th) return 1;
    if (lead < -th) return -1;
    return current;
  }

  function onNewDay(i) {
    const now = performance.now();
    for (const [k, pl] of [["s", P], ["b", B]]) {
      const d = pl.equity[i] - pl.equity[i - 1] - (ds.deposited[i] - ds.deposited[i - 1]);
      if (Math.abs(d) > pl.equity[i] * 0.004) { flashDir[k] = Math.sign(d); flashUntil[k] = now + 260; }
    }
    const ms = (mapS.get(i) || []).filter((m) => m.kind !== "topup");
    const mb = (mapB.get(i) || []).filter((m) => m.kind !== "topup");
    for (const m of ms) effects.push({ i, who: "s", side: m.side, t0: now });
    for (const m of mb) effects.push({ i, who: "b", side: m.side, t0: now });
    if (ms.length || mb.length) {
      shake(now);
      renderLog();
    } else if ((mapS.get(i) || []).length || (mapB.get(i) || []).length) renderLog();

    // 実況（放置くんは最初に買うだけなので、売買の実況はしない）
    for (const [k, pl, list] of [["s", P, ms], ["b", B, mb]]) {
      if (!list.length || pl.char === "hold" || i - ev.lastTradeCall[k] <= 15) continue;
      const syms = [...new Set(list.map((x) => x.symbol))].join("・");
      say(list[0].side === "sell" ? `${pl.name}、売って逃げた！（${syms}）` : `${pl.name}、買い戻した！（${syms}）`, k);
      ev.lastTradeCall[k] = i;
    }
    if (AI) {
      const r = AI.ml.retrains.find((x) => x.i === i && x.fresh);
      if (r) {
        say("AIくん、学び直し！", "ai");
        renderAI(i);
        const el = $("aiTop");
        el.classList.add("flash"); void el.offsetWidth;
        setTimeout(() => el.classList.remove("flash"), 60);
      }
    }
    const tw = B.twr[i] / B.twr[i - 1] - 1;
    if (Math.abs(tw) >= 0.04 && i - ev.lastBigMove > 5) {
      say(tw < 0 ? `相場が急落！ 1日で${pctText(tw)}` : `相場が急反発！ 1日で${pctText(tw)}`, tw < 0 ? "d" : "");
      ev.lastBigMove = i;
    }
    const newLeader = leaderOf(i, ev.leader);
    if (newLeader !== ev.leader) {
      const who = newLeader > 0 ? P.name : B.name;
      if (ev.leader === 0) say(`${who}が先にリード！`, newLeader > 0 ? "s" : "b");
      else say(`${who}、逆転！`, newLeader > 0 ? "s" : "b");
      ev.leader = newLeader;
      ev.milestone = 0;
    }
    const lead = Math.abs(P.equity[i] - B.equity[i]);
    const ms10 = Math.floor(lead / 100000);
    if (ev.leader !== 0 && ms10 > ev.milestone) {
      ev.milestone = ms10;
      say(`${ev.leader > 0 ? P.name : B.name}のリードが${ms10 * 10}万円を超えた！`, ev.leader > 0 ? "s" : "b");
    }
  }

  function shake(now) {
    if (reduceMotion || now - lastShake < 450) return;
    lastShake = now;
    const w = $("chartWrap");
    w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake");
  }

  // 実況は1つずつ順番に出す。早送りで溜まりすぎたら古いものを捨てる
  function say(text, kind) {
    callQueue.push({ text, kind });
    if (callQueue.length > 2) callQueue.splice(0, callQueue.length - 2);
    pumpCall();
  }
  function pumpCall() {
    const now = performance.now();
    if (now < callBusyUntil || !callQueue.length) return;
    const { text, kind } = callQueue.shift();
    const el = $("call");
    $("callText").textContent = text;
    el.className = "call t-sub show " + (kind || "");
    const hold = speed >= 20 ? 1500 : 2400;
    callBusyUntil = now + hold + 250;
    clearTimeout(callTimer);
    callTimer = setTimeout(() => { el.classList.remove("show"); setTimeout(pumpCall, 260); }, hold);
  }

  // ---------------- グラフ ----------------
  const cv = $("chart"), ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  new ResizeObserver(resize).observe(cv);

  function draw(t) {
    if (!W) resize();
    if (!W) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const n = ds.dates.length, i = day;
    const padL = 44, padR = 12, padT = 14, padB = 22;
    const pw = W - padL - padR, ph = H - padT - padB;

    // 縦軸の範囲は「ここまでの値」に合わせて、なめらかに広げる
    let lo = Infinity, hi = -Infinity;
    for (let j = 0; j <= i; j++) {
      const a = P.equity[j], b = B.equity[j], c = ds.deposited[j];
      if (a < lo) lo = a; if (b < lo) lo = b; if (c < lo) lo = c;
      if (a > hi) hi = a; if (b > hi) hi = b; if (c > hi) hi = c;
    }
    const span = Math.max(hi - lo, hi * 0.08);
    const tLo = Math.max(0, lo - span * 0.08), tHi = hi + span * 0.12;
    if (!yRange) yRange = { lo: tLo, hi: tHi };
    yRange.lo += (tLo - yRange.lo) * 0.15; yRange.hi += (tHi - yRange.hi) * 0.15;
    const X = (j) => padL + (n <= 1 ? 0 : (j / (n - 1)) * pw);
    const Y = (v) => padT + (1 - (v - yRange.lo) / (yRange.hi - yRange.lo)) * ph;

    // 目盛り（label-small 11px）
    ctx.font = '500 11px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif';
    ctx.fillStyle = C.muted; ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    const step = niceStep((yRange.hi - yRange.lo) / 4);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (let v = Math.ceil(yRange.lo / step) * step; v <= yRange.hi; v += step) {
      const y = Y(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      const dec = step >= 10000 ? 0 : step >= 1000 ? 1 : 2;   // 目盛りの間隔が細かいときは小数まで
      ctx.fillText((v / 10000).toFixed(dec) + "万", padL - 6, y);
    }
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    if (n <= 260) {     // 1年に満たないときは「月/日」で5つほど
      const every = Math.max(1, Math.ceil(n / 5));
      for (let j = 0; j < n; j += every) {
        const [, mo, da] = ds.dates[j].split("-");
        ctx.fillText(`${+mo}/${+da}`, Math.max(padL + 12, X(j)), H - padB + 6);
      }
    } else {
      let lastYear = null, lastX = -99;
      for (let j = 0; j < n; j++) {
        const y = ds.dates[j].slice(0, 4);
        if (y !== lastYear) {
          lastYear = y;
          const x = X(j);
          if (x - lastX > 26 && j > 0) { ctx.fillText("'" + y.slice(2), x, H - padB + 6); lastX = x; }
        }
      }
    }

    // 線（投入総額 → 放置くん → 戦略くん）
    line(ds.deposited, i, X, Y, C.deposit, 1.25, [4, 3]);
    line(B.equity, i, X, Y, C.bench, 2.5);
    line(P.equity, i, X, Y, C.strat, 2.5);

    // 売買の印（積立の買い増しは出さない）。印が多いときは小さく薄くして、線を隠さない
    for (const pl of [B, P]) {
      const dense = pl.markers.filter((m) => m.kind !== "topup").length * 9 / Math.max(1, pw);
      const size = dense > 2 ? 0.45 : dense > 1 ? 0.65 : 1;
      ctx.save(); ctx.globalAlpha = dense > 1 ? 0.75 : 1;
      for (const m of pl.markers) {
        if (m.i > i || m.kind === "topup") continue;
        mark(X(m.i), Y(pl.equity[m.i]), m.side, size);
      }
      ctx.restore();
    }
    // 出た瞬間の効果（広がる輪）
    const now = performance.now();
    effects = effects.filter((e) => now - e.t0 < 600);
    for (const e of effects) {
      const k = (now - e.t0) / 600;
      const ease = 1 - Math.pow(1 - k, 3);
      const pl = e.who === "s" ? P : B;
      const x = X(e.i), y = Y(pl.equity[e.i]);
      ctx.save();
      ctx.fillStyle = e.side === "buy" ? C.buy : C.sell;
      ctx.globalAlpha = 0.24 * (1 - k);
      ctx.beginPath(); ctx.arc(x, y, 6 + ease * 20, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      mark(x, y, e.side, 1 + (1 - k) * 0.6);
    }
    // 先頭の点（周りに 12% の輪）
    for (const [pl, col] of [[B, C.bench], [P, C.strat]]) {
      const x = X(i), y = Y(pl.equity[i]);
      ctx.save(); ctx.fillStyle = col;
      ctx.globalAlpha = 0.16; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  }

  function line(arr, upto, X, Y, color, width, dash) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = "round"; ctx.lineCap = "round";
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    // 横幅より点が多いときは、1ピクセルあたり1点に間引く
    const stride = Math.max(1, Math.floor(arr.length / Math.max(1, W)));
    for (let j = 0; j <= upto; j += stride) { j === 0 ? ctx.moveTo(X(j), Y(arr[j])) : ctx.lineTo(X(j), Y(arr[j])); }
    ctx.lineTo(X(upto), Y(arr[upto]));
    ctx.stroke(); ctx.restore();
  }

  function mark(x, y, side, scale) {
    const s = 5 * scale;
    ctx.save();
    ctx.fillStyle = side === "buy" ? C.buy : C.sell;
    ctx.strokeStyle = C.surface; ctx.lineWidth = 1.5;
    ctx.beginPath();
    const off = 4 + 5 * Math.min(1, scale);
    if (side === "buy") { const yy = y + off; ctx.moveTo(x, yy - s); ctx.lineTo(x - s, yy + s * 0.8); ctx.lineTo(x + s, yy + s * 0.8); }
    else { const yy = y - off; ctx.moveTo(x, yy + s); ctx.lineTo(x - s, yy - s * 0.8); ctx.lineTo(x + s, yy - s * 0.8); }
    ctx.closePath(); if (scale >= 1) ctx.stroke(); ctx.fill(); ctx.restore();
  }

  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, raw))));
    const f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  }

  // ---------------- 名場面（結果データから自動で選ぶ） ----------------
  const KNOWN = [
    ["2018-10-01", "2018-12-31", "2018年末の急落"],
    ["2020-02-01", "2020-04-30", "コロナ急落"],
    ["2022-01-01", "2022-03-31", "2022年初めの下落"],
    ["2024-07-10", "2024-08-31", "2024年8月の急落"],
    ["2025-03-15", "2025-04-30", "2025年4月の急落"],
  ];
  const knownName = (d) => (KNOWN.find(([a, b]) => d >= a && d <= b) || [])[2];
  const ym = (d) => d.slice(0, 7);
  const CHEV = '<svg class="chev" viewBox="0 0 13 22"><path d="m3 4 7 7-7 7"/></svg>';
  const JUMP = '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>';

  function buildScenes() {
    const d = ds.dates, n = d.length, tw = B.twr, out = [];
    // 1. 一番大きな急落（20営業日で一番下げた場面。始まりは直前の高値の日）
    let worst = 0, wj = -1;
    for (let j = 20; j < n; j++) { const r = tw[j] / tw[j - 20] - 1; if (r < worst) { worst = r; wj = j; } }
    if (wj > 0 && worst < -0.08) {
      let top = wj - 20; for (let j = wj - 20; j <= wj; j++) if (tw[j] > tw[top]) top = j;
      const name = knownName(d[top]) || knownName(d[wj]) || "一番大きな急落";
      out.push({ i: top, text: `${name}`, sub: ym(d[top]) });
    }
    // 2. 一番強い上昇相場（250営業日≒1年で一番上げた期間）
    if (n > 260) {
      let best = 0, bj = -1;
      for (let j = 250; j < n; j++) { const r = tw[j] / tw[j - 250] - 1; if (r > best) { best = r; bj = j; } }
      if (bj > 0 && best > 0.15) {
        const mid = d[Math.round(bj - 125)];
        out.push({ i: bj - 250, text: `${mid.slice(0, 4)}年の上昇相場`, sub: `1年で${pctText(best, 0)}` });
      }
    }
    // 3. 最大の落ち込みの始まり（戦略くん・放置くん）
    for (const [pl, who] of [[P, P.name], [B, B.name]]) {
      const pk = pl.summary.dd_peak;
      if (!pk || pl.summary.max_drawdown > -0.03) continue;
      const i = d.indexOf(pk);
      if (i >= 0) out.push({ i, text: `${who}の最大の落ち込みの始まり`, sub: `${ym(pk)}・${pctText(pl.summary.max_drawdown)}` });
    }
    // 4. リードが一番大きかった日（それぞれ）
    let maxS = 0, iS = -1, maxB = 0, iB = -1;
    for (let j = 0; j < n; j++) {
      const l = P.equity[j] - B.equity[j];
      if (l > maxS) { maxS = l; iS = j; } if (-l > maxB) { maxB = -l; iB = j; }
    }
    if (iS >= 0 && maxS > 10000) out.push({ i: iS, text: `${P.name}の最大リード`, sub: `${ym(d[iS])}・${yen(maxS)}円`, before: 40 });
    if (iB >= 0 && maxB > 10000) out.push({ i: iB, text: `${B.name}の最大リード`, sub: `${ym(d[iB])}・${yen(maxB)}円`, before: 40 });

    out.sort((a, b) => a.i - b.i);
    const scenes = [];
    for (const s of out) { if (!scenes.some((x) => Math.abs(x.i - s.i) < 20 && x.text === s.text)) scenes.push(s); }
    $("scenes").innerHTML = scenes.length ? scenes.map((s, k) =>
      `<button class="row scene st" data-k="${k}">${JUMP}<span class="tx"><span class="t-body">${escapeHtml(s.text)}</span><span class="sb t-foot num">${escapeHtml(s.sub)}</span></span>${CHEV}</button>`).join("")
      : '<div class="empty-row t-sub">目立った場面はありません</div>';
    $("scenes").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      const s = scenes[+b.dataset.k];
      seek(Math.max(0, s.i - (s.before || 15)));
      say(s.text, "");
      play();
    }));
  }

  // ---------------- 結果（ダイアログ） ----------------
  function showResult() {
    const a = P.summary, b = B.summary;
    const diff = a.final_equity - b.final_equity;
    const wn = $("winName");
    $("winKind").textContent = ds.kind === "forward" ? "いまリードしているのは" : "勝者";
    if (Math.abs(diff) < 1) { wn.textContent = "引き分け"; wn.style.color = C.muted; $("winDiff").textContent = ""; }
    else {
      wn.textContent = diff > 0 ? P.name : B.name;
      wn.style.color = diff > 0 ? C.strat : C.bench;
      $("winDiff").textContent = `最終資産の差 ${yen(Math.abs(diff))}円`;
    }
    // 4つ目: 大きいほど良い(+) / 小さいほど良い(-) / 勝ち負けなし(0)
    const rows = [
      ["最終資産", yen(a.final_equity) + "円", yen(b.final_equity) + "円", a.final_equity - b.final_equity],
      ["損益", signedYen(a.pnl), signedYen(b.pnl), a.pnl - b.pnl],
      ["最大の落ち込み", pctText(a.max_drawdown), pctText(b.max_drawdown), a.max_drawdown - b.max_drawdown],
      ["売買回数<br><small>（うち売り）</small>", `${a.n_trades}回（${a.n_sells}）`, `${b.n_trades}回（${b.n_sells}）`, 0],
      ["値差の負担額", yen(a.slippage) + "円", yen(b.slippage) + "円", b.slippage - a.slippage],
    ];
    $("thS").textContent = P.name; $("thB").textContent = B.name;
    $("resBody").innerHTML = rows.map(([k, x, y, c]) =>
      `<tr><td>${k}</td><td class="num${c > 0 ? " win" : ""}">${x}</td><td class="num${c < 0 ? " win" : ""}">${y}</td></tr>`).join("");
    renderMlResult();
    $("over").classList.add("show");
    $("again").focus({ preventScroll: true });
  }
  function hideResult() { $("over").classList.remove("show"); }

  // AIくんとランダムくんの差と、「パターンを学べたか」の判定（どの2人を選んでいても出す）
  function renderMlResult() {
    const v = ds.ml_verdict;
    const ai = roster.find((p) => p.char === "ai"), rn = roster.find((p) => p.char === "random");
    const box = $("mlRes");
    box.hidden = !(v && ai && rn);
    if (box.hidden) return;
    const a = ai.summary, r = rn.summary, d = a.final_equity - r.final_equity;
    const diff = Math.abs(d) < 1 ? "同じ" : `AIくんが ${signedYen(d)}`;
    const aucRows = v.periods.map((x) => `<tr><td colspan="3" class="ph t-foot">${escapeHtml(x.label)}・${x.days}営業日</td></tr>
      <tr><td>当たり具合（AUC）</td><td class="num">${x.auc_ai ?? "—"}</td><td class="num">${x.auc_random ?? "—"}</td></tr>`).join("");
    const sh = v.periods.map((x) => x.auc_shuffled ? `${escapeHtml(x.label)} ${x.auc_shuffled[0]}〜${x.auc_shuffled[2]}（真ん中 ${x.auc_shuffled[1]}）` : "").filter(Boolean).join("<br>");
    box.innerHTML = `<div class="hd"><span class="vs t-headline"><span class="a">AIくん</span> と <span class="r">ランダムくん</span></span>
        <span class="chip-v t-sub-em ${v.status}">${escapeHtml(v.title)}</span></div>
      <table class="t-sub"><thead><tr><th></th><th class="a t-sub-em">AIくん</th><th class="r t-sub-em">ランダムくん</th></tr></thead><tbody>
        <tr><td>最終資産</td><td class="num">${yen(a.final_equity)}円</td><td class="num">${yen(r.final_equity)}円</td></tr>
        <tr><td>損益</td><td class="num">${signedYen(a.pnl)}</td><td class="num">${signedYen(r.pnl)}</td></tr>
        ${aucRows}</tbody></table>
      <div class="dt t-foot">資産の差: ${diff}。AUC は上がる日ほど高い確率を付けられたか（0.5 = 当てずっぽう）。<br>
        ${escapeHtml(v.detail)}${sh ? `<br>答えを入れ替えて学んだ ${v.runs}通りの AUC: ${sh}` : ""}</div>`;
  }

  // ---------------- 操作 ----------------
  $("play").addEventListener("click", () => (playing ? pause() : play()));
  $("speeds").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setSpeed(+b.dataset.speed); });
  $("seek").addEventListener("input", (e) => { seek(+e.target.value); });
  // 同じ選手を左右に選んだら、もう片方と入れ替える
  $("pickA").addEventListener("change", (e) => { const a = +e.target.value; setPair(a, a === pickIdx[1] ? pickIdx[0] : pickIdx[1]); });
  $("pickB").addEventListener("change", (e) => { const b = +e.target.value; setPair(b === pickIdx[0] ? pickIdx[1] : pickIdx[0], b); });
  $("modes").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setMode(b.dataset.mode); });
  $("showResult").addEventListener("click", showResult);
  $("again").addEventListener("click", () => { hideResult(); seek(0); play(); });
  $("closeRes").addEventListener("click", hideResult);
  $("change").addEventListener("click", () => { hideResult(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); $("pickA").focus({ preventScroll: true }); });
  $("over").addEventListener("click", (e) => { if (e.target === $("over")) hideResult(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") hideResult();
    if (e.key === " " && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); }
  });

  setSpeed(1);
  // フォワードテストの記録があれば、そちらを先に開く（#replay / #forward でも選べる）
  const fw = GAME && GAME.modes && GAME.modes.forward;
  const want = location.hash.slice(1);
  setMode(want === "replay" || want === "forward" ? want : fw && !fw.empty ? "forward" : "replay");
  requestAnimationFrame((t) => { lastT = t; frame(t); });
})();
</script>
